# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Render reads this file and
# creates the service below.
#
# DATABASE_URL and JWT_SECRET_KEY are marked sync: false so Render prompts
# for them in the dashboard instead of storing them in this committed file:
#   DATABASE_URL   — a Neon (or other) Postgres connection string,
#                    e.g. postgresql+psycopg://user:pass@host/dbname
#   JWT_SECRET_KEY — generate with:
#                    python3 -c "import secrets; print(secrets.token_hex(32))"
services:
  - type: web
    name: dairytech-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
